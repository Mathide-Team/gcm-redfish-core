[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gcm-redfish-core"
version = "0.1.0"
description = "Client Redfish générique et outils d'inventaire firmware multi-constructeur (HPE/Dell/Lenovo), cœur indépendant de GTK pour le plugin Redfish de GNOME Connection Manager."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "À compléter" }
]
keywords = ["redfish", "bmc", "ilo", "idrac", "xclarity", "firmware", "gcm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "requests>=2.31",
    "urllib3>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/<ton-compte>/gcm-redfish-core"
Issues = "https://github.com/<ton-compte>/gcm-redfish-core/issues"

[tool.setuptools.packages.find]
include = ["gcm_redfish_core", "gcm_redfish_core.*"]

[tool.setuptools.package-data]
gcm_redfish_core = ["data/*.json", "data/*.xml", "data/hpe_components/*.json"]
