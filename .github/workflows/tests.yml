name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installer le paquet
        run: pip install -e ".[dev]"

      - name: Lancer les tests (moteur de dépendances)
        run: python tests/test_engine.py

      - name: Lancer les tests (import de catalogues)
        run: python tests/test_catalog_import.py

      - name: Lancer les tests (client Redfish)
        run: python tests/test_redfish_client.py
